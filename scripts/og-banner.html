<style>
  * { box-sizing: border-box; margin: 0; padding: 0 }
  html, body { width: 1200px; height: 630px; overflow: hidden }

    background: linear-gradient(135deg, #17181c 0%, #3a1f1d 45%, #C0392B 100%); position: relative }
  .glow { position: absolute; right: -160px; top: -160px; width: 640px; height: 640px; border-radius: 50%;

  .flag { position: absolute; left: 0; top: 0; bottom: 0; width: 18px; display: flex; flex-direction: column }
  .flag i { flex: 1 } .flag i:nth-child(1) { background: #000 } .flag i:nth-child(2) { background: #DD0000 } .flag i:nth-child(3) { background: #FFCE00 }
  .wrap { position: absolute; inset: 0; padding: 64px 72px 56px 90px; display: flex; flex-direction: column; justify-content: space-between }
  .brand { display: flex; align-items: center; gap: 18px }
  .brand img { height: 74px; width: auto; background: #fff; border-radius: 16px; padding: 6px 10px }
  .brand .name { font-weight: 700; font-size: 34px; letter-spacing: .2px }
  .brand .name small { display: block; font-size: 20px; font-weight: 600; color: #FFCE00; letter-spacing: 3px; text-transform: uppercase; margin-top: 2px }
  h1 { font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 78px; line-height: 1.06; letter-spacing: -.5px; max-width: 960px }
  h1 span { color: #FFCE00 }
  .sub { font-size: 30px; font-weight: 500; color: rgba(255,255,255,.88); margin-top: 20px; max-width: 900px; line-height: 1.35 }
  .chips { display: flex; gap: 14px; flex-wrap: wrap }
  .chips b { font-weight: 700; font-size: 23px; padding: 10px 22px; border-radius: 999px; background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.35) }
  .foot { display: flex; justify-content: space-between; align-items: center; font-size: 25px; font-weight: 600; color: rgba(255,255,255,.9) }
  .foot em { font-style: normal; background: #fff; color: #C0392B; font-weight: 700; padding: 10px 24px; border-radius: 12px }
