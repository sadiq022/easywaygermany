    {

        },
        {
          "@type": "Question",
          "name": "Can Indian students study in Germany without IELTS?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes, many German universities accept other English proficiency proofs like TOEFL, Duolingo, or a letter from your university stating your medium of instruction was English. Some universities also accept PTE. However, IELTS is the most widely accepted." }
        },
        {
          "@type": "Question",
          "name": "Is APS certificate mandatory for all German universities?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes, APS (Academic Evaluation Centre) certificate is mandatory for all Indian students applying to German universities, regardless of the degree level (Bachelor's or Master's). It verifies the authenticity of your academic documents." }
        },
        {
          "@type": "Question",
          "name": "How long does it take to get a Germany student visa from India?",
          "acceptedAnswer": { "@type": "Answer", "text": "Germany student visa processing typically takes 6–12 weeks from the date of your visa appointment at VFS Global. It is advisable to apply at least 3–4 months before your intended travel date." }
        },
        {
          "@type": "Question",
          "name": "Can Indian students study in Germany for free?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes, most public universities in Germany charge zero tuition fees, even for international students. You only pay a semester contribution of around €100–€350, which often includes a public transport pass." }
        },
        {
          "@type": "Question",
          "name": "What is the minimum percentage required for Masters in Germany?",
          "acceptedAnswer": { "@type": "Answer", "text": "Most German public universities require a minimum of 60–65% (around 7.0–7.5 CGPA) in your bachelor's degree. Top universities like TU Munich and RWTH Aachen may expect 75% or above. Some universities also consider your GRE or relevant work experience." }
        },
        {
          "@type": "Question",
          "name": "How many backlogs are allowed for Germany university admission?",
          "acceptedAnswer": { "@type": "Answer", "text": "Most German universities accept students with up to 5–7 backlogs, provided you have cleared all of them by the time of application. However, having fewer backlogs increases your chances. Some universities like TU Munich are strict and prefer zero backlogs." }
        },
        {
          "@type": "Question",
          "name": "What is a blocked account for Germany and which provider is best?",
          "acceptedAnswer": { "@type": "Answer", "text": "A blocked account (Sperrkonto) is a special bank account where you deposit the required funds (€11,904 for 2026) as proof of financial support for your German student visa. Popular providers include Fintiba, Expatrio, and Deutsche Bank. Fintiba and Expatrio are easiest to open online from India without a local German bank account." }
        },
        {
          "@type": "Question",
          "name": "Do I need German language to study in Germany?",
          "acceptedAnswer": { "@type": "Answer", "text": "Not necessarily. There are hundreds of fully English-taught Masters programs in Germany, especially in engineering, computer science, and business. However, knowing basic German (A1–A2 level) helps greatly with daily life, part-time jobs, and settling in Germany." }
        },
        {
          "@type": "Question",
          "name": "Can I work part-time while studying in Germany?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes. International students in Germany are allowed to work up to 120 full days or 240 half days per year. During semester breaks, this limit is more flexible. Average student jobs pay €12–€15 per hour, which can comfortably cover monthly living expenses." }
